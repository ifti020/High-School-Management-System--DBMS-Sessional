<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Homepage</title>
    <style>
        /* Basic styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 10px 0;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            /* color: #333; */
            color: #e41f1f;
        }

        /* Student info section */
        .student-info {
            text-align: center;
            margin-top: 20px;
        }
        .student-info img {
            max-width: 150px;
            border-radius: 50%;
        }

        /* Navigation */
        nav {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 10px 0;
        }
        nav ul {
            list-style: none;
            padding: 0;
        }
        nav ul li {
            display: inline;
            margin-right: 20px;
        }
        nav ul li:last-child {
            margin-right: 0;
        }
        nav a {
            text-decoration: none;
            /* color: #fff; */
            color: #ffffff;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome, John Doe!</h1>
    </header>
    <div class="container">
        <div class="student-info">
            <img src="student-avatar.jpg" alt="Student Avatar">
            <h2>John Doe</h2>
            <p>Grade: 10</p>
            <p>Student ID: 123456</p>
        </div>
        <nav>
            <ul>
                <li><a href="#">Dashboard</a></li>
                <li><a href="#">Courses</a></li>
                <li><a href="#">Grades</a></li>
                <li><a href="#">Attendance</a></li>
                <li><a href="#">Library</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="#">Logout</a></li>
            </ul>
        </nav>
    </div>
</body>
</html>
